      maxDuration: 2

  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: C:\Users\Yosi\NativeFormsAWS\security-reports\zap\isv-submission-2026-04-29\official-reports
      reportFile: 02-prefill-lambda.html
      reportTitle: TwinaForms Prefill Lambda ZAP Report
      reportDescription: Passive ZAP requestor report for the public prefill Lambda. Requests cover a valid sample public prefill lookup and safe rejection cases for missing, invalid, and unexpected parameters. This report does not include tenant bearer secrets and does not run an active attack scan.
