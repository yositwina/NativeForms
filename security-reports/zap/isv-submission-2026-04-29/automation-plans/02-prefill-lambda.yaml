        url: https://a2guxusajjhwzakf3tg6ispb640pgsno.lambda-url.eu-north-1.on.aws/
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        data: "{\"publishToken\":\"2bd0d0c2161c3c2697ad1822c913f356\",\"request\":{\"formId\":\"nf-00Dg5000008sWZN-a04g5000001BARhAAO\",\"params\":{\"email\":\"liam.carter@example.com\"}}}"
        responseCode: 200
      - name: Prefill missing publish token is rejected
        url: https://a2guxusajjhwzakf3tg6ispb640pgsno.lambda-url.eu-north-1.on.aws/
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        data: "{\"request\":{\"formId\":\"nf-00Dg5000008sWZN-a04g5000001BARhAAO\",\"params\":{\"email\":\"liam.carter@example.com\"}}}"
        responseCode: 401
      - name: Prefill invalid publish token is rejected
        url: https://a2guxusajjhwzakf3tg6ispb640pgsno.lambda-url.eu-north-1.on.aws/
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        data: "{\"publishToken\":\"invalid-zap-token\",\"request\":{\"formId\":\"nf-00Dg5000008sWZN-a04g5000001BARhAAO\",\"params\":{\"email\":\"liam.carter@example.com\"}}}"
        responseCode: 401
      - name: Prefill unexpected parameter is rejected
        url: https://a2guxusajjhwzakf3tg6ispb640pgsno.lambda-url.eu-north-1.on.aws/
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        data: "{\"publishToken\":\"2bd0d0c2161c3c2697ad1822c913f356\",\"request\":{\"formId\":\"nf-00Dg5000008sWZN-a04g5000001BARhAAO\",\"params\":{\"email\":\"liam.carter@example.com\",\"unexpected\":\"zap\"}}}"
        responseCode: 400

  - type: passiveScan-wait
