---
env:
  contexts:
    - name: TwinaForms Published Form
      urls:
        - https://forms.twinaforms.com/
      includePaths:
        - https://forms\.twinaforms\.com/twinaforms/form1.*
      excludePaths: []
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: requestor
    parameters:
      user:
    requests:
      - url: https://forms.twinaforms.com/twinaforms/form1?email=liam.carter@example.com

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: C:\Users\Yosi\NativeFormsAWS\security-reports\zap\official
      reportFile: official-zap-form1-after-managed-headers-2026-04-29.html
      reportTitle: TwinaForms Published Form ZAP Report After Managed CloudFront Security Headers
      reportDescription: Passive ZAP reconnaissance report for the TwinaForms published test form after attaching AWS managed SecurityHeadersPolicy to the forms.twinaforms.com CloudFront distribution. This run sends a single GET request and does not run an active attack scan.
