---
env:
  contexts:
    - name: TwinaForms Submission Logs Lambda
      urls:
        - https://jafi5esjqnvip3gbdahj7d2a7m0eyhby.lambda-url.eu-north-1.on.aws/
      includePaths:
        - https://jafi5esjqnvip3gbdahj7d2a7m0eyhby\.lambda-url\.eu-north-1\.on\.aws/.*
      excludePaths: []
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: requestor
    requests:
      - name: Submission log config status missing bearer is rejected
        url: https://jafi5esjqnvip3gbdahj7d2a7m0eyhby.lambda-url.eu-north-1.on.aws/submission-log-config/status?orgId=00Dg5000008sWZN
        method: GET
        headers:
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        responseCode: 401
      - name: Submission logs list missing bearer is rejected
        url: https://jafi5esjqnvip3gbdahj7d2a7m0eyhby.lambda-url.eu-north-1.on.aws/submission-logs?orgId=00Dg5000008sWZN
        method: GET
        headers:
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        responseCode: 401
      - name: Submission log detail missing bearer is rejected
        url: https://jafi5esjqnvip3gbdahj7d2a7m0eyhby.lambda-url.eu-north-1.on.aws/submission-logs/zap-test-id?orgId=00Dg5000008sWZN
        method: GET
        headers:
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        responseCode: 401
      - name: Submission log config sync missing bearer is rejected
        url: https://jafi5esjqnvip3gbdahj7d2a7m0eyhby.lambda-url.eu-north-1.on.aws/submission-log-config/sync
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ISV passive scan"
        data: "{\"orgId\":\"00Dg5000008sWZN\",\"submissionLogPublicKey\":\"zap\"}"
        responseCode: 401

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: C:\Users\Yosi\NativeFormsAWS\security-reports\zap\isv-submission-2026-08-20-0.14.0.1\official-reports
      reportFile: 05-submission-logs-lambda.html
      reportTitle: TwinaForms Submission Logs Lambda ZAP Report
      reportDescription: Passive ZAP requestor report for the submission logs Lambda. Routes are scanned with missing bearer tokens to prove unauthenticated rejection without exposing tenant secrets. This report does not run an active attack scan.


