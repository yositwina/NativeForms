---
# ACTIVE ATTACK SCAN - NOT FOR ISV SUBMISSION
# Admin API Lambda protected by Cognito JWT. Seeded without a Cognito token, so
# the active scanner fuzzes the pre-auth attack surface (stays at the 401 layer).
env:
  contexts:
    - name: TwinaForms Admin API
      urls:
        - https://q3ldy3bqmksfqaacu376ktnmhi0xnhok.lambda-url.eu-north-1.on.aws/
      includePaths:
        - https://q3ldy3bqmksfqaacu376ktnmhi0xnhok\.lambda-url\.eu-north-1\.on\.aws/.*
      excludePaths: []
  parameters:
    failOnError: false
    failOnWarning: false
    continueOnFailure: true
    progressToStdout: true

jobs:
  - type: requestor
    requests:
      - name: Seed admin health (no Cognito token)
        url: https://q3ldy3bqmksfqaacu376ktnmhi0xnhok.lambda-url.eu-north-1.on.aws/admin/health
        method: GET
        headers:
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ACTIVE attack scan (not for submission)"
      - name: Seed admin tenants (no Cognito token)
        url: https://q3ldy3bqmksfqaacu376ktnmhi0xnhok.lambda-url.eu-north-1.on.aws/admin/tenants
        method: GET
        headers:
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ACTIVE attack scan (not for submission)"
      - name: Seed admin settings update (no Cognito token)
        url: https://q3ldy3bqmksfqaacu376ktnmhi0xnhok.lambda-url.eu-north-1.on.aws/admin/settings
        method: POST
        headers:
          - "Content-Type:application/json"
          - "User-Agent:Mozilla/5.0 ZAP TwinaForms ACTIVE attack scan (not for submission)"
        data: "{\"statusAlertEmailRecipient\":\"zap@example.com\"}"

  - type: activeScan
    parameters:
      context: TwinaForms Admin API
      maxScanDurationInMins: 8
      maxRuleDurationInMins: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 3

  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: C:\Users\Yosi\NativeFormsAWS\security-reports\AttackTestsNotForSubmission\reports
      reportFile: 06-admin-api-cognito-active.html
      reportTitle: TwinaForms Admin API ACTIVE Attack Scan (NOT FOR SUBMISSION)
      reportDescription: Active OWASP ZAP attack scan of the Admin API without Cognito tokens. Fuzzes the pre-auth attack surface. Internal hardening evidence only, not part of the ISV submission packet.
